# /etc/pal-server-v2/env — the VALIDATED Pi environment for pal-server-v2.
# Tracked copy (nora 2026-08-26 durability item): the repo must be able to reproduce the
# rig-validated state; without this file a Pi reprovision silently reverts every flag.
# Secrets are NOT tracked — fill the three <secret> lines from the Pi (mode 0600, root)
# or the owner's vault when provisioning. Everything else is verbatim from the Pi as
# validated on the 2026-08-26 G13 run (SESSION-LOG-2026-08-26-G13.md T11/T11a).
#
# Flags intentionally ABSENT (run at their code defaults): SNAP_PROPERTY_RELAY (off —
# superseded by SNAP_CHARSTATS_SEED for the character fix), SNAP_RELIABLE_WINDOW (32 —
# the 08-26 runs show zero WINDOW_FULL with this set), SNAP_COUNT_PUSH=0 kept explicit
# below as deployed.

PAL_V2_MASTER_KEY=<secret-from-pi>
PAL_V2_DATA_DIR=/var/lib/pal-server-v2
PAL_V2_SELF_HOST=192.168.2.121
PAL_V2_SNAP_HOST=192.168.2.121
PAL_V2_DIRECTORY_FILE=/etc/pal-server-v2/directory.json
PAL_V2_LOBBY_NAME="PAL V2"
PAL_V2_BIND_HOST=0.0.0.0
PAL_V2_LOG_LEVEL=debug
PAL_V2_ENABLE_DNS=true
PAL_V2_DNS_RECORDS=stage6.sega.com=192.168.2.121,snap01.capcom.client.sf.yav4.com=192.168.2.121,app01.reo.capcom.sf.yav4.com=192.168.2.121
PAL_V2_ENABLE_DNAS=true
PAL_V2_DNAS_CERT=/etc/pal-server-v2/dnas/server.crt
PAL_V2_DNAS_CA_CERT=/etc/pal-server-v2/dnas/ca-cert.pem
PAL_V2_DNAS_KEY=<secret-from-pi>
PAL_V2_DNAS_PACKET_DIR=/etc/pal-server-v2/dnas/packets
PAL_V2_UDP_BIND_ADDRESS=192.168.2.121
PAL_V2_DYNAMIC_DNAS_TOKEN=true
PAL_V2_UDP_ATTACHMENT_NONCE=<secret-from-pi>

# --- SN@P behavior flags (the validated set) ---
SNAP_EXIT_CLOSE_MIRROR=1
SNAP_COMPLETION_SEQ_ECHO=1
SNAP_GAME_BEACON_ECHO=0
SNAP_COUNT_PUSH=0
SNAP_CHANNEL_BIT_ECHO=true
SNAP_GAME_RELAY=true
SNAP_ROOM_STAT=true
SNAP_ROSTER_TO_JOINER=true
SNAP_MEMBER_ID_TOKEN=true
SNAP_HOST_RESEAT=true
SNAP_OP10_DROP_SELF=true
SNAP_CHARSTATS_SEED=true
# G13 (2026-08-26): relay the UNRELIABLE op-0f game class (peer keepalive + entity
# records) room-scoped except sender. Rig-validated: enemies move+attack on the joiner.
# NEVER set SNAP_GAME_BEACON_ECHO=1 (proven fatal, RS1-A).
SNAP_GAME_BEACON_RELAY=true
