[Service]
# 2026-06-20: reply-driven cmd=0x0c. count=0 → game polls forever (no room to
# enter) → 840 timeout. Try count=1 advertising one room named with the Pi IP
# (DNS-resolvable connect host, same as slot name) so the game can room-enter.
Environment=SNAP_ROOM_PUSH=0
Environment=SNAP_ROOM_QUERY_REPLY=1
Environment=SNAP_ROOM_CATEGORY=0
Environment=SNAP_ROOM_COUNT=1
Environment=SNAP_ROOM_REC_NAME=192.0.2.121
Environment=SNAP_ROOM_SEQ_OFFSET=2
