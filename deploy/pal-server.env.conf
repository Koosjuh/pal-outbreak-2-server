# PAL server runtime flags — SINGLE SOURCE OF TRUTH (mirrors the Pi systemd drop-in)
# 2026-07-13 consolidation of 17 accreted /etc/systemd/system/pal-server.service.d/*.conf files.
# GOLDENS.md flagged that the live drop-ins were NOT in git — this file fixes that gap.
# Deploy: copy to /etc/systemd/system/pal-server.service.d/00-pal-server.conf (replacing the 17),
#         `sudo systemctl daemon-reload && sudo systemctl restart pal-server`, then verify the
#         effective env is unchanged: `systemctl show pal-server.service -p Environment`.
# Consolidation is ZERO effective change: only =0 flags and DORMANT params (parent push OFF) were
# dropped — those are true no-ops. All active non-zero flags are preserved verbatim.

[Service]

# ── CONFIRMED — golden g10-g11-2026-07-06 (rig-witnessed). Trusted. ──────────────
Environment=SNAP_ACK_OPS=all
Environment=SNAP_ACK_OP48_ALWAYS=1
Environment=SNAP_OP48_REPLY_ALL=1
Environment=SNAP_AREA_OP48=1
Environment=SNAP_AREA_OP48_COUNT=10
Environment=SNAP_AREA_CONFIRM_REPLY=1
Environment=SNAP_AREA_LIST=1
Environment=SNAP_LOBBY_LEAVE_REPLY=1
Environment=SNAP_CMD0C_SELECTOR12=1
Environment=SNAP_OP40_KEEPALIVE=1
Environment=SNAP_OP40_KEY=SNAP-SWAN
Environment=SNAP_SUPPRESS_UNKNOWN_REPLY=1
Environment=SNAP_TXSEQ_FIX=1
Environment=SNAP_ROOMLIST_REPLY=1
Environment=SNAP_ROOM_SEQ_ADVANCE=1
Environment=SNAP_RESET_SESSION_ON_REGISTER=1

# ── EXPERIMENTAL — the create/room path (NOT yet rig-confirmed; the verify list). ─
Environment=SNAP_CREATE_SLOT_ACCEPT=1
Environment=SNAP_CREATE_FLOW=1
Environment=SNAP_LOBBY_STATE=1
Environment=SNAP_MULTIPLEX_WALK=1
Environment=SNAP_MODIFIER_REPLY=1
Environment=SNAP_ROOM_ENTER_ACCEPT=1
Environment=SNAP_ROOM_INFO_OP10=1
Environment=SNAP_ROOM_COUNT=1
Environment=SNAP_ROOMLIST_REGISTRY=1
Environment=SNAP_ROOMLIST_ONE=1
Environment=SNAP_REENTRY_CONFIRM_REPLY=1
Environment=SNAP_MEMBER_JOIN_PUSH=1
Environment=SNAP_R2_ID=1
Environment=SNAP_LOBBY_SLOTS=2
Environment=SNAP_LOBBY_SLOT_MAX_PLAYERS=4
Environment=SNAP_ROOM_REC_NAME=192.0.2.121
Environment=SNAP_ROOM_SEQ_OFFSET=2
Environment=SNAP_AREA_SCENARIO=1
Environment=SNAP_AREA_PLAYERCNT=1

# ── EXPERIMENTAL — SUSPECT (froze on unanswered op0c before; excluded from golden). ─
# Drop candidate — verify it is still needed before keeping.
Environment=SNAP_AREA_MODIFIERS=1

# ── DROP CANDIDATE — ineffective (T16: op0a fills 0x6cdbe6, the WRONG buffer; the drawn
#    roster is 0x6c7c2c via SNAP_MEMBER_JOIN_PUSH). Kept ON for now = zero-change; remove
#    after the create verify run confirms the member-JOIN push supersedes it. ───────────
Environment=SNAP_CREATE_MEMBERLIST=1

# ── DEV/SCALE ────────────────────────────────────────────────────────────────────
Environment=SNAP_LEAN_HOTPATH=1

# ── DROPPED in this consolidation (were dead: =0 defaults, or DORMANT params whose parent
#    push flag is OFF — all true no-ops): SNAP_CMD0C_TEST, SNAP_ESTAB_ON_BIND, SNAP_ESTAB_PUSH,
#    SNAP_ROOM_ENTER_PUSH(=0) + its params SNAP_ROOM_ENTER_OP/F4, SNAP_ROOM_PUSH, SNAP_ROOM_QUERY_REPLY,
#    SNAP_ROOM_CATEGORY, SNAP_ROOM_RENDER, SNAP_ROOM_RENDER_A0, SNAP_RENDER2, SNAP_RENDER_NONREL,
#    SNAP_NAMEDSLOT_WORD0, SNAP_PINE_AUTO_ADVANCE, SNAP_POST_OP48_PUSH(=0) + SNAP_POST_OP48_STATUS.
